name: Deploy ke GitHub Pages
on:
  push:
    branches: [main]
  # TANPA jadwal harian. Halaman berita statis dan sitemap (scripts/berita-statis.mjs) diterbitkan ulang saat berita terbit: basis data (pg_cron + pg_net, supabase/sumber/29-terbit-ulang.sql)
  # meminta alur ini dijalankan lewat workflow_dispatch di bawah, HANYA bila ada berita terbit yang berubah atau yang jadwalnya tiba. Manual: Actions > Deploy ke GitHub Pages > Run workflow.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Migrasi SQL diterapkan OTOMATIS sebelum situs terbit, hanya bila push ini menambah/mengubah berkas di supabase/migrasi, dan HANYA sesudah pemilik
  # menyetujui di lingkungan "produksi" (GitHub: Settings > Environments > produksi > Required reviewers). Kunci sambungan tulis SIGARDA_DB_URL_TULIS
  # disimpan di lingkungan itu, bukan di rahasia repositori, dan alur ini tidak pernah berjalan untuk pull request. Migrasi gagal = situs TIDAK terbit
  # (aplikasi tidak pernah lebih baru dari basis datanya). Belum dipasang (rahasia kosong) = dilewati dan cara manual lama tetap berlaku.
  # Panduan: docs/penerapan-otomatis.md. Alur manual (tandai awal, atau terapkan tanpa push): migrasi-manual.yml.
  cek:
    runs-on: ubuntu-latest
    outputs:
      ada: ${{ steps.diff.outputs.ada }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          SEBELUM: ${{ github.event.before }}
          SESUDAH: ${{ github.sha }}
          KEJADIAN: ${{ github.event_name }}
        run: |
          ada=false
          if [ "$KEJADIAN" = "push" ]; then
            # Push pertama, riwayat ditulis ulang, atau commit lama tak ditemukan: anggap ada (penerapan bersifat idempoten dan berpelacak).
            if [ -z "$SEBELUM" ] || [ "$SEBELUM" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$SEBELUM^{commit}" 2>/dev/null; then
              ada=true
            elif [ -n "$(git diff --name-only "$SEBELUM" "$SESUDAH" -- supabase/migrasi)" ]; then
              ada=true
            fi
          fi
          echo "ada=$ada" >> "$GITHUB_OUTPUT"
          echo "Migrasi berubah pada push ini: $ada"
  migrasi:
    needs: cek
    if: needs.cek.outputs.ada == 'true' && github.repository == 'tribudi3267/sigarda'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: produksi
    concurrency:
      group: migrasi-produksi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/cadangan/package-lock.json
      - run: npm ci --prefix scripts/cadangan
      - name: Terapkan migrasi yang belum tercatat
        env:
          SIGARDA_DB_URL_TULIS: ${{ secrets.SIGARDA_DB_URL_TULIS }}
        run: node scripts/penerapan/jalankan.mjs terapkan --lewati-bila-kosong
  build:
    needs: [cek, migrasi]
    # Berjalan bila migrasi berhasil atau memang tidak diperlukan (dilewati); tidak berjalan bila migrasi gagal atau dibatalkan.
    if: ${{ !cancelled() && needs.cek.result == 'success' && needs.migrasi.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      # Isi di GitHub: Settings > Secrets and variables > Actions > tab Variables (bukan Secrets).
      # Nilainya (URL proyek dan kunci anon/publishable) memang terlihat di browser; keamanan data dijaga oleh
      # Row Level Security di database. JANGAN isi kunci service_role di sini.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Opsional: hanya diisi bila nama Edge Function di Supabase bukan "sigarda".
      VITE_NAMA_FUNGSI: ${{ vars.VITE_NAMA_FUNGSI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Periksa variabel Supabase
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Variabel VITE_SUPABASE_URL dan VITE_SUPABASE_ANON_KEY belum diisi. Isi di Settings > Secrets and variables > Actions > Variables, lalu jalankan ulang."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          # Situs dilayani dari akar domain khusus (sigarda.smabukateja.sch.id), jadi base "/".
          # Tanpa domain khusus (tribudi3267.github.io/sigarda/) ganti menjadi: /${{ github.event.repository.name }}/
          VITE_BASE: /
          # Membuat satu halaman HTML per berita terbit + sitemap dari data publik (sg_berita_publik). Gagal = peringatan, situs tetap terbit.
          SIGARDA_BERITA_STATIS: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # WAJIB eksplisit: tanpa `if`, GitHub melewati job ini bila job `migrasi` di hulu dilewati (push tanpa migrasi baru), padahal `build` berhasil,
    # sehingga situs tidak pernah terbit. Terbit bila build berhasil (build sendiri sudah menahan diri bila migrasi gagal).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
