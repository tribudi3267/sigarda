name: Deploy ke GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Isi di GitHub: Settings > Secrets and variables > Actions > tab Variables (bukan Secrets).
      # Nilainya (URL proyek dan kunci anon/publishable) memang terlihat di browser; keamanan data dijaga oleh
      # Row Level Security di database. JANGAN isi kunci service_role di sini.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Opsional: hanya diisi bila nama Edge Function di Supabase bukan "sigarda".
      VITE_NAMA_FUNGSI: ${{ vars.VITE_NAMA_FUNGSI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Periksa variabel Supabase
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Variabel VITE_SUPABASE_URL dan VITE_SUPABASE_ANON_KEY belum diisi. Isi di Settings > Secrets and variables > Actions > Variables, lalu jalankan ulang."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          # Situs dilayani dari akar domain khusus (sigarda.smabukateja.sch.id), jadi base "/".
          # Tanpa domain khusus (tribudi3267.github.io/sigarda/) ganti menjadi: /${{ github.event.repository.name }}/
          VITE_BASE: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
